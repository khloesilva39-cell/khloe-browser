<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Khloe Luxe Browser</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@600&display=swap');

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:
    linear-gradient(rgba(0,0,0,.85),rgba(0,0,0,.95)),
    url("https://www.transparenttextures.com/patterns/leopard.png");
    background-color:#050505;
    color:white;
    font-family:Poppins,sans-serif;
}


/* neon header */

.header{

height:90px;
background:#000;
border-bottom:4px solid hotpink;
box-shadow:0 0 25px hotpink;

display:flex;
align-items:center;
justify-content:center;

}


.logo{

font-family:"Playfair Display",serif;
font-size:42px;
color:#ff1493;

text-shadow:
0 0 5px white,
0 0 15px hotpink,
0 0 30px hotpink;

}


.bunny{

font-size:45px;
margin-right:15px;

}



/* main */

.container{

padding:20px;

}



/* search */

.search{

width:100%;
padding:18px;

border-radius:50px;

background:#111;

border:3px solid hotpink;

color:white;

font-size:17px;

box-shadow:
0 0 10px hotpink;

outline:none;

}



.search::placeholder{

color:#ff9bd5;

}



/* buttons */


.buttons{

display:flex;
gap:15px;
flex-wrap:wrap;

margin:20px 0;

}



button{

background:
linear-gradient(#ff69b4,#ff1493);

border:none;

color:white;

padding:14px 25px;

border-radius:30px;

font-weight:bold;

font-size:15px;

cursor:pointer;

box-shadow:

0 0 10px hotpink,
inset 0 0 10px white;

}



button:hover{

transform:scale(1.08);

box-shadow:

0 0 30px hotpink;

}



/* browser */

iframe{

width:100%;

height:65vh;

border-radius:25px;

border:

4px solid hotpink;

background:white;

box-shadow:

0 0 35px hotpink;

}



/* bottom */


.footer{

text-align:center;

margin-top:15px;

color:#ff69b4;

letter-spacing:2px;

}


</style>

</head>


<body>


<div class="header">

<div class="logo">

<span class="bunny">♡</span>
KHLOE LUXE

</div>

</div>



<div class="container">


<input

class="search"

id="url"

placeholder="enter a website or search..."

onkeydown="enter(event)">


<div class="buttons">


<button onclick="go('https://example.com')">
♡ TEST
</button>


<button onclick="go('https://httpbin.org')">
♡ BROWSER TEST
</button>


<button onclick="go('https://wikipedia.org')">
♡ KNOWLEDGE
</button>


<button onclick="go('https://itch.io')">
♡ GAMES
</button>


</div>



<iframe id="display"></iframe>



<div class="footer">

♡ HOT PINK INTERNET ERA ♡

</div>


</div>



<script>


function go(url){

document.getElementById("display").src=url;

}



function enter(e){

if(e.key==="Enter"){


let value=document.getElementById("url").value;


if(!value.startsWith("http")){


value="https://www.google.com/search?q="+value;


}


document.getElementById("display").src=value;


}

}



</script>


</body>
</html>
